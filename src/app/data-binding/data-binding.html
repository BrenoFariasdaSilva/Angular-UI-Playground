<div class="demo-panel">
  <div class="binding-grid">
    <label class="demo-field">
      <span>Manual property + event binding</span>
      <input
        [value]="name"
        (input)="name = $any($event.target).value"
        type="text"
        placeholder="Enter your name"
      />
    </label>
    <label class="demo-field">
      <span>Two-way binding with ngModel</span>
      <input [(ngModel)]="name" type="text" placeholder="Enter your name" />
    </label>
  </div>
  <p class="demo-result" aria-live="polite">Current value: {{ name }}</p>
</div>
