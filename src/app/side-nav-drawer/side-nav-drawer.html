<button class="drawer-trigger" type="button" aria-label="Open navigation" (click)="visible = true">
  <span aria-hidden="true">☰</span>
</button>

<p-drawer [(visible)]="visible" [showCloseIcon]="false">
  <div class="drawer-panel">
    <header class="drawer-header">
      <h2 id="drawer-title">Navigation</h2>
      <button type="button" aria-label="Close navigation" (click)="visible = false">×</button>
    </header>
      <p>A slide-in panel from the edge of the screen for contextual content. Home stays first, followed by alphabetical links.</p>

    <nav aria-label="Page navigation">
      @for (item of navigation; track item.path) {
        <button type="button" [routerLink]="item.path" (click)="visible = false">{{ item.label }}</button>
      }
    </nav>
  </div>
</p-drawer>
