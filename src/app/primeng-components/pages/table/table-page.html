<section>
  <h2>PrimeNG component: p-table</h2>
  <p>
    Click a column heading to sort ascending or descending; <code>p-sort-icon</code> shows the
    active direction. Use a filter below each field and press Enter to narrow the results.
  </p>

  <p-table [value]="products" filterDisplay="row" [tableStyle]="{ 'min-width': '34rem' }">
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Product <p-sort-icon field="name" /></th>
        <th pSortableColumn="category">Category <p-sort-icon field="category" /></th>
        <th pSortableColumn="price">Price <p-sort-icon field="price" /></th>
      </tr>
      <tr>
        <th><p-column-filter field="name" type="text" display="row" matchMode="contains" /></th>
        <th><p-column-filter field="category" type="text" display="row" matchMode="contains" /></th>
        <th><p-column-filter field="price" type="numeric" display="row" /></th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.price | currency }}</td>
      </tr>
    </ng-template>
  </p-table>
</section>
