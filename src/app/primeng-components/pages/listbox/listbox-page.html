<section>
  <h2>PrimeNG component: p-listbox</h2>
  <p>Select a city from a keyboard-accessible list.</p>
  <p-listbox
    [options]="cities"
    [(ngModel)]="selected"
    optionLabel="name"
    [style]="{ width: '20rem' }"
  ></p-listbox>
  <p>Selected: {{ selected?.name || 'None' }}</p>
</section>
