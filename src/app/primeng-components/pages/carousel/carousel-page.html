<section>
  <h2>PrimeNG component: p-carousel</h2>
  <p>Browse a sequence of related highlights.</p>

  <p-carousel [value]="highlights" [numVisible]="2" [numScroll]="1" [circular]="true">
    <ng-template #item let-highlight>
      <article class="carousel-card">
        <h3>{{ highlight.title }}</h3>
        <p>{{ highlight.description }}</p>
      </article>
    </ng-template>
  </p-carousel>
</section>
