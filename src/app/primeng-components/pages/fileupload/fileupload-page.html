<section>
  <h2>PrimeNG component: p-fileupload</h2>
  <p>Choose image files to attach; this demo does not send them to a server.</p>
  <p-fileupload
    name="demo[]"
    mode="basic"
    chooseLabel="Choose images"
    accept="image/*"
    [multiple]="true"
    [maxFileSize]="1000000"
  />
</section>
