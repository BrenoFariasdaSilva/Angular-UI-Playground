<section>
  <h2>PrimeNG component: p-paginator</h2>
  <p>Navigate a lesson list four items at a time.</p>

  <ol class="lesson-list" [start]="first + 1">
    @for (lesson of visibleLessons; track lesson) {
      <li>{{ lesson }}</li>
    }
  </ol>

  <p-paginator
    [first]="first"
    [rows]="rows"
    [totalRecords]="lessons.length"
    [rowsPerPageOptions]="[4, 8, 12]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} lessons"
    (onPageChange)="changePage($event)"
  />
</section>
